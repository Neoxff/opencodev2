<symbol id="folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
<symbol id="folderplus" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6M9 13h6"/></symbol>

<symbol id="cl" viewBox="0 0 24 24"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="archive" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></symbol>
<symbol id="sliders" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
<symbol id="newses" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></symbol>
<symbol id="pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
<symbol id="term" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 21v-5h5"/></symbol>
<symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>

<symbol id="brain" viewBox="0 0 24 24"><path d="M9.5 4A3 3 0 0 0 6.6 7 3.2 3.2 0 0 0 4.5 12a3.2 3.2 0 0 0 2.1 5A3 3 0 0 0 12 18.5V5.5A2.4 2.4 0 0 0 9.5 4Z"/><path d="M14.5 4a3 3 0 0 1 2.9 3 3.2 3.2 0 0 1 2.1 5 3.2 3.2 0 0 1-2.1 5A3 3 0 0 1 12 18.5"/></symbol>

<symbol id="caret" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>

<canvas id="sky"></canvas><div class="vig"></div>

<div id="app" class="rp">
  <aside class="side">
    <div class="logo"><span class="mark"></span><b>opencode</b><span class="v2">V2</span></div>
    <button class="newbtn" id="newbtn"><svg class="i"><use href="#newses"/></svg>New session</button>
    <div class="wk"><span>Workspaces</span><div>
      <button id="bSearch" aria-label="Search"><svg class="i s"><use href="#search"/></svg></button>
      <button aria-label="Add folder"><svg class="i s"><use href="#folderplus"/></svg></button>
      <button id="bHist" aria-label="History"><svg class="i s"><use href="#clock"/></svg></button>
      <button aria-label="Collapse"><svg class="i s"><use href="#cl"/></svg></button></div></div>
    <input class="sfilter" id="sfilter" placeholder="Search folders" aria-label="Search folders">
    <div class="tree" id="tree"></div>
    <div class="foot">
      <div class="keys"><span><kbd>alt+n</kbd>new</span><span><kbd>ctrl+d</kbd>del</span><span><kbd>ctrl+r</kbd>ren</span></div>
      <div class="fold"><svg class="i"><use href="#archive"/></svg><b>Archived</b></div>
      <div class="fold"><svg class="i"><use href="#sliders"/></svg><b>Server</b></div>
    </div>
  </aside>

  <section class="panel is-welcome" id="panel">
    <div class="head">
      <button class="back" aria-label="Back"><svg class="i"><use href="#back"/></svg></button>
      <h1 id="title">New session</h1>
      <button class="goalbtn" id="goalb" style="opacity:0"><svg class="i s"><use href="#target"/></svg>Goal definition</button>
      <div class="tabs">
        <button class="tab on" data-t="conv">Conversation</button>
        <button class="tab" data-t="config">Config</button>
        <button class="tab" data-t="logs">Logs</button>
        <span class="tab work" id="work" style="display:none">Working...<svg class="i s"><use href="#refresh"/></svg></span>
        <button class="iconb" id="rpT" aria-label="Toggle details panel"><svg class="i"><use href="#panelr"/></svg></button>
      </div>
    </div>
    <div class="sc">
      <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
      <svg class="i s up" id="up" style="opacity:0"><use href="#caret"/></svg>
      <div class="thumb" id="thumb" style="opacity:0"><i></i><i></i><i></i></div>
      <div class="welcome" id="welcome"></div>
    </div>
    <div class="dockwrap" id="dock">
      <div class="menu" id="menu" role="listbox"></div>
      <div class="comp">
        <textarea id="ta" rows="2" placeholder="Describe what you want to build. / commands, @ files or sessions" aria-label="Message"></textarea>
        <div class="ctl">
          <button class="round" aria-label="Add"><svg class="i s"><use href="#plus"/></svg></button>
          <button class="sel" id="selA"><svg class="i s"><use href="#bot"/></svg><span id="vA">orchestrator</span><svg class="i s c"><use href="#right"/></svg><div class="pop" id="popA"></div></button>
          <span class="sp"></span>
          <button class="sel" id="selV"><span id="vV">max</span><svg class="i s c"><use href="#right"/></svg><div class="pop" id="popV"></div></button>
          <button class="sel" id="selM"><span id="vM">Tidepool Alpha Free</span><svg class="i s c"><use href="#right"/></svg><div class="pop" id="popM" style="left:auto;right:0"></div></button>
          <button class="mic" aria-label="Voice"><svg class="i"><use href="#mic"/></svg></button>
          <button class="send" id="send" aria-label="Send"><svg class="i ar"><use href="#arrup"/></svg><span class="sq"></span></button>
        </div>
      </div>
      <div class="status" id="status"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="split"></div>
  </section>

  <aside class="rpanel" id="rpanel"></aside>
</div>

<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>
<div class="dev"><button id="skyb" class="on">Ciel</button><button id="reopen">Nouvelle ouverture</button><button id="hint">Tape /</button><button id="pal">ctrl+p</button></div>

<!--OPENCODEV2_UI_JS--></script>
